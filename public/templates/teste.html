<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrossel de Projetos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-content">
            <div class="project-details">
                <div class="project-number" id="projectNumber">01</div>
                <h1 class="project-title" id="projectTitle">Frontend Project</h1>
                <p class="project-description" id="projectDescription">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scelerisque consequat, faucibus et, et.
                </p>
                <p class="project-technologies" id="projectTechnologies">Html 5, Css 3, Javascript</p>
                <div class="project-links">
                    <a href="#" class="link-button"><i class="fas fa-external-link-alt"></i></a>
                    <a href="#" class="link-button"><i class="fab fa-github"></i></a>
                </div>
            </div>
            <div class="project-image-container">
                <img src="img/thumb1.png" alt="Imagem do Projeto 1" class="project-image" id="projectImage">
            </div>
        </div>
        <div class="carousel-navigation">
            <button class="nav-button prev-button" id="prevButton"><i class="fas fa-chevron-left"></i></button>
            <button class="nav-button next-button" id="nextButton"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
